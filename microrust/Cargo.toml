[package]
name = "microrust"
description = "MicroRust Application Framework"
resolver = "3"
version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
microrust_macros = { workspace = true }

async-trait = { workspace = true }
ctor = { workspace = true }
petgraph = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }

# Own target: the fixture registers a deliberate dependency cycle, which would
# poison the shared suite.
[[test]]
name = "cycle_test"
path = "tests/inject/cycle_test.rs"

# Own target: two structs deliberately claim the same trait, and
# `report_registrations()` is expected to abort on it.
[[test]]
name = "trait_collision_test"
path = "tests/inject/trait_collision_test.rs"
