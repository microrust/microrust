[package]
name = "microrust"
description = "MicroRust Application Framework"
resolver = "3"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
microrust_macros = { workspace = true }

async-trait = { workspace = true }
# `ctor_parse!` is a declarative macro, so the `proc_macro` feature (the
# `#[ctor]` attribute) is unused. `priority` stays even though no priorities
# are set: on Apple targets it changes how ctors are emitted, and without it
# rustc's dead-code lint misses the registration fn, so a constructor reached
# only through a trait binding warns as "never used" (`trait_cycle_test.rs`).
ctor = { workspace = true, default-features = false, features = ["std", "priority"] }
# `macros` and `rt-multi-thread` back `#[microrust::main]` / `#[microrust::test]`,
# which expand through the `__private` re-export so users need no tokio entry.
# No `sync`: the registries use `std::sync`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }

[dev-dependencies]
tracing-test = { workspace = true, features = ["no-env-filter"] }

# Own target: the fixture registers a deliberate dependency cycle, which would
# poison the shared suite.
[[test]]
name = "cycle_test"
path = "tests/inject/cycle_test.rs"

# Own target: a deliberate cycle that closes through a trait binding rather
# than a direct struct dependency.
[[test]]
name = "trait_cycle_test"
path = "tests/inject/trait_cycle_test.rs"

# Own target: two structs deliberately claim the same trait, and
# `report_registrations()` is expected to abort on it.
[[test]]
name = "trait_collision_test"
path = "tests/inject/trait_collision_test.rs"
