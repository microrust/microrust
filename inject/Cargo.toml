[package]
name = "microrust_inject"
version = "0.0.0-alpha.7"
authors = ["Steve Schneider"]
license = "Apache-2.0"
description = "MicroRust Dependency Injection"
readme = "README.md"
edition = "2024"
resolver = "2"

[dependencies]
microrust_inject_macros = { version = "0.0.0-alpha.7", path = "../inject_macros" }

crosstrait = { workspace = true }
ctor = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
microrust = { version = "0.0.0-alpha.7", path = "../microrust" }

async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }
