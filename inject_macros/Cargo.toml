[package]
name = "microrust_inject_macros"
version = "0.0.0-alpha.0"
authors = ["Steve Schneider"]
license = "Apache-2.0"
description = "MicroRust Dependency Injection Macros"
readme = false
edition = "2024"
resolver = "2"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits"]}
