default_job = "test"
env.CARGO_TERM_COLOR = "always"

[jobs.test]
command = ["cargo", "test"]
need_stdout = true
allow_warnings = true
on_success = "scroll-to-bottom"
# on_failure = "scroll-to-bottom"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy"]
need_stdout = false
