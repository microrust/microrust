[workspace]
members = ["microrust", "macros", "examples"]
resolver = "3"

[workspace.package]
version = "0.0.0-alpha.11"
authors = ["Steve Schneider"]
license = "Apache-2.0"
readme = "README.md"
edition = "2024"

[workspace.dependencies]
microrust_macros = { version = "0.0.0-alpha.11", path = "macros" }

async-trait = "0.1.92"
ctor = "1.0.13"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
tokio = "1.53.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-test = "0.2.6"

# Enforced by every crate in the workspace, so `cargo build` and bare
# `cargo clippy` both reject a regression without extra flags.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
